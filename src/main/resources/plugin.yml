name: MinecraftGuard
version: '0.1.0'
main: nl.tobias.minecraftguard.MinecraftGuardPlugin
api-version: '26.2'
description: Reports and conservative server-side movement alerts for Paper.
author: Tobias
commands:
  report:
    description: Open the player report menu.
    usage: /report
    permission: minecraftguard.report
  guard:
    description: MinecraftGuard administration.
    usage: /guard alerts|reload
    permission: minecraftguard.admin
permissions:
  minecraftguard.report:
    default: true
  minecraftguard.admin:
    default: op
  minecraftguard.alerts:
    default: op
  minecraftguard.bypass:
    default: false
