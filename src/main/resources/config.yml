# ShieldGuard configuratie
# Werelden waarin de bescherming actief is (alleen overworld-achtige werelden aanbevolen:
# in de Nether/End zou erts door stone/deepslate worden vervangen).
worlds:
  - world

# Staff met deze permission worden niet gemaskeerd
bypass-permission: shieldguard.bypass

freecam-protection:
  enabled: true
  # Alles dieper dan (speler-Y - dit aantal) wordt als deepslate/stone naar de client gestuurd.
  # De grens wordt afgerond op hele chunk-secties (16 blokken).
  depth-below-player: 32
  # Hoe ver (in chunks) om de speler heen we chunks opnieuw sturen als de grens verschuift
  refresh-radius-chunks: 8
  refresh-interval-ticks: 10
  # Maximaal aantal chunk-refreshes per speler per run (voorkomt lag)
  chunks-per-run: 6
  # Pas opnieuw maskeren als de speler minstens zoveel blokken omhoog is gegaan
  remask-gap-blocks: 32

xray-protection:
  enabled: true
  # Erts dat nergens aan lucht/water/lava grenst wordt als stone (boven Y=0) of deepslate (onder Y=0) gestuurd.
  # Zodra een blok ernaast wordt weggegraven/opgeblazen wordt het echte erts getoond.
  reveal-distance: 96
  hidden-blocks:
    - coal_ore
    - deepslate_coal_ore
    - copper_ore
    - deepslate_copper_ore
    - iron_ore
    - deepslate_iron_ore
    - gold_ore
    - deepslate_gold_ore
    - redstone_ore
    - deepslate_redstone_ore
    - lapis_ore
    - deepslate_lapis_ore
    - diamond_ore
    - deepslate_diamond_ore
    - emerald_ore
    - deepslate_emerald_ore
    - ancient_debris

reports:
  cooldown-seconds: 60
  min-reason-length: 4
  # Voorgestelde redenen bij tab-completion
  suggested-reasons:
    - Xray
    - Freecam
    - Killaura
    - Fly
    - Speed
    - Scaffold
    - Beledigen
    - Spam
    - Griefing
  # Als zoveel open reports op dezelfde speler staan krijgt staff een extra waarschuwing
  alert-threshold: 3
  discord-webhook-url: ""

messages:
  prefix: "<dark_gray>[<red>ShieldGuard</red>]</dark_gray> "
  no-permission: "<red>Daar heb je geen toestemming voor.</red>"
  players-only: "<red>Dit commando kan alleen door spelers worden gebruikt.</red>"
  report-usage: "<gray>Gebruik: <white>/report <speler> <reden></white></gray>"
  report-self: "<red>Je kunt jezelf niet reporten.</red>"
  report-unknown-player: "<red>Die speler is nog nooit op de server geweest.</red>"
  report-reason-short: "<red>Geef een duidelijkere reden op.</red>"
  report-cooldown: "<red>Wacht nog <seconds> seconden voordat je opnieuw reportet.</red>"
  report-duplicate: "<red>Je hebt <target> al gereport; een staff-lid bekijkt dit nog.</red>"
  report-sent: "<green>Bedankt! Je report over <white><target></white> is verstuurd (#<id>).</green>"
  staff-new-report: "<yellow>Nieuw report <white>#<id></white>: <white><reporter></white> meldt <red><target></red> — <gray><reason></gray> <aqua>[klik om te teleporteren]</aqua></yellow>"
  staff-alert: "<red><bold>Let op:</bold> <target> heeft nu <count> open reports!</red>"
  reports-none: "<gray>Er zijn geen open reports.</gray>"
  reports-list-header: "<gold>Open reports (<count>):</gold>"
  reports-list-entry: "<gray>#<id> <white><target></white> ← <reporter>: <reason></gray>"
  report-not-found: "<red>Report #<id> bestaat niet.</red>"
  report-closed: "<green>Report #<id> is afgesloten.</green>"
  report-already-closed: "<red>Report #<id> is al afgesloten.</red>"
  report-tp-offline: "<yellow><target> is offline; je wordt naar de plek van het report geteleporteerd.</yellow>"
  report-tp-done: "<green>Geteleporteerd naar <target>.</green>"
  reload-done: "<green>Configuratie herladen.</green>"
  gui-title: "Open reports"
