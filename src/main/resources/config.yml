# Movement checks are advisory. Keep alerts enabled while tuning; automatic punishments are intentionally absent.
movement:
  enabled: true
  horizontal-distance-per-tick: 1.25
  vertical-distance-per-tick: 1.65
  alerts-to-notify: 3
  alert-cooldown-seconds: 12
  sustained-flight-seconds: 8

reports:
  notify-permission: minecraftguard.alerts
  max-reason-length: 160
