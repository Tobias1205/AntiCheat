name: Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - run: mvn -B package

      - uses: actions/upload-artifact@v4
        with:
          name: ShieldGuard-Paper-26.2
          path: target/ShieldGuard-1.0.0.jar
          if-no-files-found: error
